<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#13131a"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>

    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c5cfc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#4ec9b0"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ec9b0"/>
      <stop offset="100%" stop-color="#7c5cfc"/>
    </linearGradient>

    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Rounded Square for Favicon Container -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>

  <!-- Ambient Glow Behind Monogram -->
  <circle cx="256" cy="256" r="140" fill="#7c5cfc" opacity="0.18" filter="url(#neonGlow)"/>

  <!-- Hexagonal Monogram Shield -->
  <g filter="url(#dropShadow)">
    <polygon points="256,80 412,170 412,342 256,432 100,342 100,170" 
             fill="#13131a" 
             stroke="url(#brandGrad)" 
             stroke-width="10"/>

    <!-- Inner Letter A -->
    <path d="M 185,355 L 256,180 L 327,355 H 295 L 256,275 L 217,355 Z" 
          fill="url(#brandGrad)"/>
    
    <!-- Inner Letter M -->
    <path d="M 185,355 L 220,230 L 256,295 L 292,230 L 327,355 H 300 L 256,265 L 212,355 Z" 
          fill="url(#accentGrad)" 
          opacity="0.9"/>
  </g>

  <!-- Tech Accent Nodes -->
  <circle cx="256" cy="80" r="8" fill="#4ec9b0" filter="url(#neonGlow)"/>
  <circle cx="412" cy="170" r="6" fill="#7c5cfc" filter="url(#neonGlow)"/>
  <circle cx="100" cy="170" r="6" fill="#7c5cfc" filter="url(#neonGlow)"/>
  <circle cx="256" cy="432" r="8" fill="#7c5cfc" filter="url(#neonGlow)"/>
</svg>
